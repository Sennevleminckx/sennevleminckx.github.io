project:
  type: website
  output-dir: _site
  # CNAME and self-hosted fonts must be copied verbatim into _site so they
  # survive `quarto render` / `quarto publish gh-pages`. Verified, not assumed.
  resources:
    - CNAME
    - assets/fonts/
    - assets/cv.pdf

website:
  title: "Senne Vleminckx"
  description: "Nurse and quantitative researcher at the University of Antwerp."
  site-url: "https://sennevleminckx.be"
  favicon: assets/img/favicon.svg
  open-graph: true
  navbar:
    pinned: true
    logo: ""
    title: "Senne Vleminckx"
    left:
      - text: "Home"
        href: index.qmd
      - text: "CV"
        href: cv.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Consultancy"
        href: consultancy.qmd
    right:
      - text: "Contact"
        href: contact.qmd
  page-footer:
    border: true
    left:
      - text: "Vleminckx Consultancy bv · BE 0785.296.063"
    center:
      - text: "Legal & privacy"
        href: legal.qmd
    right:
      - text: "&copy; 2026"

format:
  html:
    theme:
      - default
      - styles.scss
    page-layout: article
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    link-external-icon: false
    smooth-scroll: true
    include-in-header:
      - text: |
          <link rel="preload" href="/assets/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
          <link rel="preload" href="/assets/fonts/plex-sans-600.woff2" as="font" type="font/woff2" crossorigin>
    include-before-body:
      - text: |
          <a href="#quarto-content" class="skip-link">Skip to content</a>
    grid:
      body-width: 780px
      sidebar-width: 200px
      margin-width: 180px
